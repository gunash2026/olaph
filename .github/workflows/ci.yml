name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /olaph
          NEXT_PUBLIC_SITE_URL: https://gunash2026.github.io/olaph
      - uses: actions/upload-artifact@v4
        with:
          name: olaph-preview
          path: apps/web/out
