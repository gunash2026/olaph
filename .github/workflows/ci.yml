name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /olaph
          NEXT_PUBLIC_SITE_URL: https://gunash2026.github.io/olaph
          PAYLOAD_SECRET: ci-build-only-not-a-deployed-credential
          CMS_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      - run: node scripts/check-export.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /olaph
      - uses: actions/upload-artifact@v4
        with:
          name: olaph-preview
          path: apps/web/out
